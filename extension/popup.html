<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Spellcheck Extension</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans" type="text/css">
  <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
  <div class="modal-header">
    <h1 class="logo">
      <img src="images/racoon_icon.png" alt="full sized icon" class="logo-icon">
      Colab Spellcheck <span class="version">(0.2.0)</span>
    </h1>
  </div>

  <div class="modal-content">

    <p class="dict-note">Offline spellcheck, English (US).</p>

    <button class="flat_button" id="spell_check_button">Check Active Cell</button>
    <div class="spelling_suggestions_container"></div>


    <table>
    <tr>
      <td><a class="footer_link" href="https://www.gnu.org/licenses/licenses.html" target="_blank">licensed under GPLv3</a></td>
      <td id="footer_right"><a class="footer_link" href="https://github.com/MartenThompson/colab_spellcheck" target="_blank">source</a></td>
    </tr>
    </table>

  </div>
  <script src="bjspell/BJSpell.js"></script>
  <script src="popup.js"></script>

</body>
</html>
