<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Spellcheck Extension</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans" type="text/css">
  <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
  <div class="modal-header">
    <h1 class="logo">
      <button type="button" class="settings-gear" id="settings_button" title="Settings" aria-label="Settings">&#x2699;</button>
      <img src="images/racoon_icon.png" alt="full sized icon" class="logo-icon">
      Colab Spellcheck <span class="version">(0.3.0)</span>
    </h1>
  </div>

  <div class="modal-content">

    <div id="main_view" class="main-view">
      <button class="flat-button" id="spell_check_button">Check Active Cell</button>
      <div class="spelling_suggestions_container"></div>
    </div>

    <div id="settings_pane" class="settings-pane" style="display:none">
      <h2>Settings</h2>
      <h3 class="settings-subheading">Personal dictionary</h3>
      <p class="settings-hint">Limit 10,000 words.</p>
      <ul id="personal_dictionary_list" class="personal-dict-list"></ul>
      <form id="add_personal_word_form" class="add-personal-form">
        <label for="add_personal_word_input" class="add-word-label"><strong>Add word</strong></label>
        <p class="add-word-hint">Words must be letters only (a–z), up to 48 characters.</p>
        <input type="text" id="add_personal_word_input" name="word" maxlength="48" autocomplete="off" spellcheck="false">
        <button type="submit" class="flat-button flat-button-small">Add</button>
      </form>
    </div>

    <table>
    <tr>
      <td><a class="footer_link" href="https://www.gnu.org/licenses/licenses.html" target="_blank">licensed under GPLv3</a></td>
      <td id="footer_right"><a class="footer_link" href="https://github.com/MartenThompson/colab_spellcheck" target="_blank">source</a></td>
    </tr>
    </table>

  </div>
  <script src="bjspell/BJSpell.js"></script>
  <script src="popup.js"></script>

</body>
</html>
